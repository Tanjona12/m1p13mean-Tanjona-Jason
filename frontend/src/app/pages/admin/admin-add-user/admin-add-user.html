<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card admin-form-card p-4">

                <h3 class="fw-bold mb-4">Ajouter un utilisateur</h3>

                @if (errorMessage) {
                    <div class="alert alert-danger">
                        {{ errorMessage }}
                    </div>
                }

                @if (successMessage) {
                    <div class="alert alert-success">
                        {{ successMessage }}
                    </div>
                }

                <!-- <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }} 
                </div>

                <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
                </div> -->

                <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

                    <div class="row">

                        <!-- IMAGE -->
                        <div class="col-md-4 text-center mb-4">

                            <div class="profile-image-container">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png" alt="">
                            </div>

                            <input type="file" class="form-control mt-3" (change)="onFileChange($event)">

                        </div>

                        <!-- INFOS -->
                        <div class="col-md-8">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom complet</label>
                                <input type="text" class="form-control" formControlName="name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">CIN</label>
                                <input type="text" class="form-control" formControlName="cin">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Téléphone</label>
                                <input type="text" class="form-control" formControlName="phone">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" formControlName="email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mot de passe</label>
                                <input type="password" class="form-control" formControlName="password">
                            </div>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a href="/admin/users" class="btn btn-outline-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-success">
                            Enregistrer
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
