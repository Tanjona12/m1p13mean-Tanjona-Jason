<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card admin-form-card p-4">

                <h3 class="fw-bold mb-4">Ajouter un utilisateur</h3>

                <form>

                    <div class="row">

                        <!-- IMAGE -->
                        <div class="col-md-4 text-center mb-4">

                            <div class="profile-image-container">
                                <img src="https://via.placeholder.com/150" alt="">
                            </div>

                            <input type="file" class="form-control mt-3">

                        </div>

                        <!-- INFOS -->
                        <div class="col-md-8">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom complet</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom de la boutique</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">CIN</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Téléphone</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Facebook</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Instagram</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Site Web</label>
                                    <input type="text" class="form-control">
                                </div>
                            </div>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a href="/admin/users" class="btn btn-outline-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-success">
                            Enregistrer
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>



<div class="container-fluid">
    <router-outlet></router-outlet>
</div>
