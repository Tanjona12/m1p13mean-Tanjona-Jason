@if (loading) {
  <p class="text-center">Chargement...</p>
}

@if (!loading && user) {
<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card profile-card p-4">

                <div class="row align-items-center">

                    <!-- IMAGE PROFIL -->
                    <div class="col-md-4 text-center">
                        <div class="profile-image-container">
                            <img [src]="user?.image?.url || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png'">
                        </div>

                        <button class="btn btn-outline-danger btn-sm mt-3" (click)="deleteUser()">
                            Supprimer cette utilisateur
                        </button>
                    </div>

                    <!-- INFORMATIONS -->
                    <div class="col-md-8">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="fw-bold mb-0">{{ user?.name }}</h3>
                        </div>

                        <hr>

                        <div class="profile-info">

                            <div class="mb-3">
                                <strong>Poste :</strong>
                                <p class="text-muted mb-0">Vendeur chez Shopinay</p>
                            </div>

                            <div class="mb-3">
                                <strong>Email :</strong>
                                <p class="text-muted mb-0">{{ user?.email }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>CIN :</strong>
                                <p class="text-muted mb-0">{{ user?.cin }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>Téléphone :</strong>
                                <p class="text-muted mb-0">{{ user?.phone }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>Membre depuis :</strong>
                                <p class="text-muted mb-0">
                                    Janvier 2026
                                </p>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
}
