<div class="container-fluid my-4">

    <div class="row g-4 mb-4">

        <div class="col-md-4">
            <div class="card stat-card p-4 text-center">
                <h6 class="text-muted">Propriétaires Boutique</h6>
                <h2 class="fw-bold text-primary">{{ totalOwners }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat-card p-4 text-center">
                <h6 class="text-muted">Clients</h6>
                <h2 class="fw-bold text-success">{{ totalClients }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat-card p-4 text-center">
                <h6 class="text-muted">Total Utilisateurs</h6>
                <h2 class="fw-bold text-dark">{{ totalUsers }}</h2>
            </div>
        </div>

    </div>

        <div class="card p-3 mb-4">

        <div class="row g-3 align-items-center">

            <div class="col-md-6">
                <input type="text" class="form-control"
                    placeholder="Rechercher par nom ou email..."
                    [formControl]="searchControl">
            </div>

            <div class="col-md-3">
                <select class="form-select" [(ngModel)]="filterRole" (change)="applyFilters()">
                    <option value="">Tous</option>
                    <option value="client">Client</option>
                    <option value="boutique">Propriétaire Boutique</option>
                </select>
            </div>

            <div class="col-md-3 text-end">
                <a href="/admin/add_user" class="btn btn-success">
                    Ajouter utilisateur +
                </a>
            </div>

        </div>

    </div>


        <div class="row g-4">

        <!-- Carte utilisateur -->
        <div class="col-md-6 col-lg-3"  *ngFor="let user of paginatedUsers">
            <a [routerLink]="['/admin/user', user._id]" class="text-decoration-none">
                <div class="card user-card p-3">
                    <div class="d-flex align-items-center">

                        <div class="user-image">
                            <img [src]="user.image?.url || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png'" style="width: 50; height: 50;">
                        </div>

                        <div class="ms-3 flex-grow-1">
                            <h6 class="fw-bold mb-0">{{ user.name }}</h6>
                            <small class="text-muted">{{ user.email }}</small>
                            <div>
                                <span class="badge" [ngClass]="user.role === 'client' ? 'bg-warning' : 'bg-primary mt-2'">
                                    {{ user.role === 'client' ? 'Client' : 'Propriétaire Boutique' }}
                                </span>
                            </div>
                        </div>

                    </div>
                    <hr>

                    <div class="d-flex justify-content-between">
                        <button class="btn btn-outline-light text-success text-decoration-none" (click)="toggleStatus(user)">
                            <fa-icon [icon]="user.isActive ? faOn : faOff"></fa-icon>
                            {{ user.isActive ? 'Actif' : 'Désactivé' }}
                        </button>
                    </div>
                </div>
            </a>
            
        </div>

        <!-- Dupliquer ici -->

    </div>


        <div class="d-flex justify-content-center mt-5">

        <!-- <nav>
            <ul class="pagination">

                <li class="page-item disabled">
                    <a class="page-link">Précédent</a>
                </li>

                <li class="page-item active">
                    <a class="page-link">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link">Suivant</a>
                </li>

            </ul>
        </nav> -->

        <nav>
            <ul class="pagination">
                <li class="page-item" [class.disabled]="currentPage === 1">
                    <a class="page-link" (click)="changePage(currentPage - 1)">Précédent</a>
                </li>

                <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
                    <a class="page-link" (click)="changePage(page)">{{ page }}</a>
                </li>

                <li class="page-item" [class.disabled]="currentPage === totalPages">
                    <a class="page-link" (click)="changePage(currentPage + 1)">Suivant</a>
                </li>
            </ul>
        </nav>

    </div>

</div>
