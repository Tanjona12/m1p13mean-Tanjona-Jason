<div class="container-fluid my-4">

    <div class="row g-4 mb-4">

            <div class="col-md-6">

                    placeholder="Rechercher par nom ou email...">
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option value="">Tous</option>
                    <option value="client">Client</option>
                    <option value="owner">Propriétaire Boutique</option>
                </select>
            </div>

            <div class="col-md-3 text-end">
                <a href="/admin/add_user" class="btn btn-success">

            </div>

        </div>

    </div>


        <div class="row g-4">

        <!-- Carte utilisateur -->
        <div class="col-md-6 col-lg-3">
            <a href="/admin/user/1" class="text-decoration-none">

                    <div class="d-flex align-items-center">

                        <div class="user-image">
                            <img src="https://randomuser.me/api/portraits/men/32.jpg">
                        </div>

                        <div class="ms-3 flex-grow-1">
                            <h6 class="fw-bold mb-0">Pierre Falimanantsoa</h6>
                            <small class="text-muted">pierre@email.com</small>
                            <div>
                                <span class="badge bg-warning mt-2">Client</span>
                            </div>
                        </div>

                    </div>
                    <hr>

                    <div class="d-flex justify-content-between">
                        <button class="btn btn-outline-light text-success text-decoration-none">

                        <a href="/admin/update_user" class="btn btn-outline-primary">

        </div>
