<div class="container py-5">

    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-end-0">
                    <fa-icon [icon]="faSearch"></fa-icon>
                </span>
                <input type="text"
                       class="form-control border-start-0"
                       placeholder="Rechercher une boutique...">
            </div>
        </div>
    </div>

    <!-- Cartes boutiques -->
    <div class="row g-4">

        <div class="col-sm-6 col-md-4 col-lg-3">
            <div class="card boutique-card h-100">
                <div class="image-container">
                    <img src="https://img.freepik.com/vecteurs-libre/logo-elegant-pour-salon-coiffure-beaute_1048-17696.jpg?semt=ais_hybrid&w=740&q=80"
                         alt="Logo boutique">
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-center">Nom boutique</h5>
                    <p class="card-text text-muted">
                        Description de la boutique.
                    </p>
                    <a href="/shop/1" class="btn btn-primary text-light mt-auto w-100">
                        Voir plus +
                    </a>
                </div>
            </div>
        </div>
        

        <!-- Duplique les col ici -->

    </div>
</div>


<div class="container-fluid">
    <router-outlet></router-outlet>
</div>
