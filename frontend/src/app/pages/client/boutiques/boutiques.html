<div class="container py-5">

    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-end-0">
                    <fa-icon [icon]="faSearch"></fa-icon>
                </span>
                <input type="text"
                       class="form-control border-start-0"
                       placeholder="Rechercher une boutique..."
                        [(ngModel)]="searchTerm"
                        (input)="onSearch()"
                >
            </div>
        </div>
    </div>

    <!-- Cartes boutiques -->
    <div class="row g-4">

        <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let boutique of filteredBoutiques">
            <a [routerLink]="['/shop', boutique._id]" class="text-decoration-none text-dark">
                <div class="card boutique-card h-100">
                    <div class="image-container">
                        <img [src]="boutique.logo?.url"
                            alt="Logo boutique">
                    </div>
                    <div class="card-body d-flex flex-column  text-center">
                            <h5 class="card-title">{{ boutique.name_shop }}</h5>
                            <p class="card-text">
                                - {{ boutique.box }} -
                            </p>
                            <p class="card-text text-muted">
                                {{ boutique.description }}.
                            </p>
                            <div class="d-flex justify-content-around">
                                <button type="button"
                                        class="btn btn-outline-light text-success">
                                    <fa-icon [icon]="boutique.isActive ? faOn : faOff"></fa-icon>
                                    {{ boutique.isActive ? 'Activer' : 'Désactiver' }}
                                </button>
                            </div>
                    </div>
                </div>
            </a>  
        </div>
        

    </div>
</div>
