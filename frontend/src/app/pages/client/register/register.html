<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4 register-card">
        <h3 class="text-center mb-4 fw-bold">Inscription</h3>
        <!-- Message erreur -->
        <div class="alert alert-danger py-2">
            error message
        </div>

        <form>

            <!-- Nom -->
            <div class="mb-3">
                <label class="form-label">Nom complet</label>
                <input
                    type="name"
                    class="form-control"
                    name="name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Adresse email</label>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    required
                    email
                >
            </div>

            <!-- Mot de passe -->
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                >
            </div>

            <!-- Bouton -->
            <button
                type="submit"
                class="btn btn-primary w-100 mt-2"
            >
                S'inscrire
            </button>

        </form>

        <!-- Liens -->
        <div class="text-center mt-3">

            <span class="small">
                J'ai un compte ?
                <a href="/login" class="text-primary fw-semibold text-decoration-none">
                    Se connecter
                </a>
            </span>

        </div>

    </div>
</div>


<div class="container-fluid">
    <router-outlet></router-outlet>
</div>
