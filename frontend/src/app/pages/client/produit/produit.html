<div class="container my-5">
@if (produit){
    <div class="row g-5">

        <!-- ===== IMAGE PRODUIT ===== -->
        <div class="col-md-6">

            <div class="product-detail-image">
                <img [src]="produit.imageProduit?.url"
                     alt="Nom produit">
            </div>

        </div>


        <!-- ===== DETAILS PRODUIT ===== -->
        <div class="col-md-6">

            <div class="product-detail-info">

                <!-- Nom + Prix -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="fw-bold">{{ produit.name }}</h3>
                    <h4 class="text-success fw-bold">{{ formatPrice(produit.price) }}</h4>
                </div>

                <hr>

                <!-- Description -->
                <p class="text-muted">
                    {{ produit.description || 'Pas de description' }}.
                </p>

                <!-- Boutique -->
                <div class="mb-3">
                    <strong>Boutique :</strong> <a [routerLink]="['/shop', produit.boutiqueId._id]" class="text-decoration-none text-warning"> {{ produit.boutiqueId.name_shop }}</a>
                </div>

                <!-- Catégorie -->
                <div class="mb-3">
                    <strong>Catégorie :</strong> {{ produit.category }}
                </div>

                <!-- Quantité -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Quantité</label>
                    <input type="number"
                       class="form-control"
                       [value]="quantity"
                       min="1"
                       (input)="onQuantityChange($event)">
                </div>

                <!-- Total -->
                <div class="d-flex justify-content-between mb-4">
                    <strong>Total :</strong>
                    <span class="fw-bold text-success">{{ formatPrice(total) }}</span>
                </div>

                <!-- Bouton -->
                <button class="btn btn-success w-100 btn-lg" (click)="addToCart()">
                    🛒 Ajouter au panier
                </button>

            </div>

        </div>

    </div>
}

</div>



<div class="container-fluid">
    <router-outlet></router-outlet>
</div>
