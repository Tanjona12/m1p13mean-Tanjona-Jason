<div class="container my-5">

    <h2 class="fw-bold mb-4">🛒 Mon Panier</h2>

    <!-- ===== SI PANIER VIDE ===== -->
    <!-- Supprime cette section si panier contient des produits -->
    <div class="cart-empty text-center py-5 d-none">
        <h4 class="fw-bold">Votre panier est vide</h4>
        <p class="text-muted">Ajoutez des produits pour commencer vos achats.</p>
        <a href="/boutique" class="btn btn-success mt-3">
            Continuer mes achats
        </a>
    </div>

    <div class="row">

        <!-- ===== LISTE PRODUITS ===== -->
        <div class="col-lg-8">

            <!-- Produit -->
            <div class="card cart-item mb-4 p-3">
                <div class="row align-items-center">

                    <!-- Image -->
                    <div class="col-md-3">
                        <div class="cart-image-container">
                            <img src="https://img.freepik.com/photos-premium/jeu-tennis-balles-tennis-raquettes-arriere-plan_488220-1471.jpg"
                                alt="Produit">
                        </div>
                    </div>

                    <!-- Info -->
                    <div class="col-md-4">
                        <h6 class="fw-bold">Nom du Produit</h6>
                        <p class="text-muted mb-1">Catégorie : Sport</p>
                        <p class="text-success fw-semibold">25 000 Ar</p>
                    </div>

                    <!-- Quantité -->
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Quantité</label>

                        <div class="quantity-box d-flex align-items-center">
                            <button class="btn btn-outline-secondary btn-sm">-</button>
                            <input type="text" class="form-control text-center mx-2" value="1">
                            <button class="btn btn-outline-secondary btn-sm">+</button>
                        </div>
                    </div>

                    <!-- Total -->
                    <div class="col-md-2 text-end">
                        <p class="fw-bold text-success">25 000 Ar</p>
                        <button class="btn btn-sm btn-outline-danger mt-2">
                            Supprimer
                        </button>
                    </div>

                </div>
            </div>

        </div>


        <!-- ===== RÉSUMÉ ===== -->
        <div class="col-lg-4">

            <div class="card p-4 cart-summary">

                <h5 class="fw-bold mb-3">Résumé</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span>Sous-total</span>
                    <span>25 000 Ar</span>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span>Livraison</span>
                    <span>5 000 Ar</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between fw-bold mb-4">
                    <span>Total</span>
                    <span class="text-success">30 000 Ar</span>
                </div>

                <button class="btn btn-success w-100 btn-lg">
                    ✔ Passer la commande
                </button>

            </div>

        </div>

    </div>

</div>


<div class="container-fluid">
    <router-outlet></router-outlet>
</div>
