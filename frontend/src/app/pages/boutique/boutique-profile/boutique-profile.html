@if (user) {
<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card profile-card p-4">

                <div class="row align-items-center">

                    <!-- IMAGE PROFIL -->
                    <div class="col-md-4 text-center">
                        <div class="profile-image-container">
                            <img [src]="user.image?.url || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png'">
                        </div>
                        
                        <a [routerLink]="['/owner/update_profil', user._id]" class="btn btn-primary btn-sm mt-3">
                            Modifier mon information
                        </a>
                    </div>

                    <!-- INFORMATIONS -->
                    <div class="col-md-8">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="fw-bold mb-0">{{ user.name }}</h3>

                            <!-- <a [routerLink]="['/admin/update_user', user?._id]" class="btn btn-success">
                                Modifier
                            </a> -->
                        </div>

                        <hr>

                        <div class="profile-info">

                            <div class="mb-3">
                                <strong>Email :</strong>
                                <p class="text-muted mb-0">{{ user.email || 'vide' }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>CIN :</strong>
                                <p class="text-muted mb-0">{{ user.cin }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>Téléphone :</strong>
                                <p class="text-muted mb-0">{{ user.phone }}</p>
                            </div>

                            <div class="mb-3">
                                <strong>Membre depuis :</strong>
                                <p class="text-muted mb-0">
                                    Janvier 2026
                                </p>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

}
