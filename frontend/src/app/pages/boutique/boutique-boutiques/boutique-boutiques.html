@if (boutique) {
<div class="container py-5">

    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
                <h2>MA BOUTIQUE</h2>
        </div>
    </div>

    <!-- Cartes boutiques -->
    <div class="row g-4">

        <div class="col-sm-6 col-md-4 col-lg-3">
            <a [routerLink]="['/owner/shop', boutique._id]" class="text-decoration-none text-dark">
                <div class="card boutique-card h-100">
                    <div class="image-container">
                        <img [src]="boutique.logo?.url"
                            alt="Logo boutique">
                    </div>
                    <div class="card-body d-flex flex-column  text-center">
                            <h5 class="card-title">{{ boutique.name_shop }}</h5>
                            <p class="card-text">
                                - BOX {{ boutique.box }} -
                            </p>
                            <p class="card-text text-muted">
                                {{ boutique.description || "vide" }}.
                            </p>
                            <div class="d-flex justify-content-around">
                                <a [routerLink]="['/owner/update_shop', boutique._id]" class="btn btn-outline-primary text-decoration-none" title="Supprimer cette boutique">
                                      Modifier
                                </a>
                            </div>
                    </div>
                </div>
            </a>  
        </div>
        

        <!-- Duplique les col ici -->

    </div>
</div>

}
