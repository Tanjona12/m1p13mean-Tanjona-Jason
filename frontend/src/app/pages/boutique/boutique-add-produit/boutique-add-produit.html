<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card admin-form-card p-4">

                <h3 class="fw-bold mb-4">Ajouter un produit</h3>

                @if (errorMessage) {
                    <div class="alert alert-danger">
                        {{ errorMessage }}
                    </div>
                }

                @if (successMessage) {
                    <div class="alert alert-success">
                        {{ successMessage }}
                    </div>
                }

                <!-- <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }} 
                </div>

                <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
                </div> -->

                <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

                    <div class="row">

                        <!-- INFOS -->
                        <div class="col-md-8">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom</label>
                                <input type="text" class="form-control" formControlName="name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Déscription</label>
                                <input type="text" class="form-control" formControlName="description">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Prix</label>
                                <input type="number" class="form-control" formControlName="price">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Stock</label>
                                <input type="number" class="form-control" formControlName="stock">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Categorie</label>
                                <input type="text" class="form-control" formControlName="category">
                            </div>`

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Image</label>
                                <input type="file" class="form-control mt-3" (change)="onFileChange($event)">
                            </div>


                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a href="/owner/shop" class="btn btn-outline-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-success">
                            Enregistrer
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
