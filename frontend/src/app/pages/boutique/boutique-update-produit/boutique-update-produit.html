<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card admin-form-card p-4">

                <h3 class="fw-bold mb-4">Modifier ma boutique</h3>
                @if(errorMessage){
                    <div class="alert alert-danger">
                         {{ errorMessage }} 
                    </div>

                }
                <form [formGroup]="produitForm" (ngSubmit)="onSubmit()">

                    @if (produit) {
                    <div class="row">

                        <!-- IMAGE -->
                        <div class="col-md-4 text-center mb-4">

                            <div class="profile-image-container">
                                <img [src]="produit.imageProduit?.url"
                                 alt="logo">
                            </div>

                            <input type="file" class="form-control mt-3" (change)="onFileChange($event)">

                        </div>

                        <!-- INFOS -->
                        <div class="col-md-8">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom de la produit</label>
                                <input type="text" class="form-control" [value]= "produit.name" formControlName="name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Description </label>
                                <input type="text" class="form-control" [value]= "produit.description" formControlName="description">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Prix</label>
                                <input type="number" class="form-control" [value]= "produit.price" formControlName="price">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Catégorie</label>
                                <input type="text" class="form-control" [value]= "produit.category" formControlName="category">
                            </div>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a [routerLink]="['/owner/product', produit._id]" class="btn btn-outline-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-success">
                            Enregistrer
                        </button>
                    </div>

                }

                </form>

            </div>

        </div>
    </div>

</div>
