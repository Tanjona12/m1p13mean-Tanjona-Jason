<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card admin-form-card p-4">

                <h3 class="fw-bold mb-4">Modifier ma boutique</h3>
                @if(errorMessage){
                    <div class="alert alert-danger">
                         {{ errorMessage }} 
                    </div>

                }
                <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

                    @if (user) {
                    <div class="row">

                        <!-- IMAGE -->
                        <div class="col-md-4 text-center mb-4">

                            <div class="profile-image-container">
                                <img [src]="user.image?.url"
                                 alt="votre image">
                            </div>

                            <input type="file" class="form-control mt-3" (change)="onFileChange($event)">

                        </div>

                        <!-- INFOS -->
                        <div class="col-md-8">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom</label>
                                <input type="text" class="form-control" [value]= "user.name" formControlName="name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Téléphone </label>
                                <input type="text" class="form-control" [value]= "user.phone" formControlName="phone">
                            </div>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a [routerLink]="['/owner/profil']" class="btn btn-outline-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-success">
                            Enregistrer
                        </button>
                    </div>

                }

                </form>

            </div>

        </div>
    </div>

</div>
